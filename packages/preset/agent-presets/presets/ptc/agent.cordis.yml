# The `ptc` agent preset: the standard coding agent, presented as PTC mode.
#
# A DELTA preset. `extends` names the base preset whose composition this file
# patches: each row under `rows` is a runtime patch with the same semantics
# the profile layer applies to a `cordis.patch.yml` — an `id` row overrides
# that entry's fields (the whole `config` replaced, not merged), and an
# `insert` row appends new entries. The roster composes the chain before
# mounting, so this file never loads on its own and a row that matches
# nothing fails loud on the roster, not at the first session.
#
# The general-purpose `workflow` tool is the deliberate exception to
# `standard`: PTC mode uses `run_code` as its model-authored composition
# surface, and the `tool-presentation` row below turns the remaining registry
# into a generated SDK, so a sequence that would be five round trips becomes
# one.
#
# The registry itself stays on the host plane — the agent loop's scheduler and
# the API proxy's presenters are its consumers — so what this preset owns is
# the PRESENTATION of that registry for this agent alone. Native sessions run
# beside this one in the same process, each seeing its own catalog.
#
# Everything this delta does not patch comes from `standard` unchanged,
# including its realm rules: a service row in the composed file still MUST sit
# inside a group carrying an `isolate` realm, or `dsh-agent-presets` rejects
# the mount.

extends: standard
rows:
  # Keep the engine above for `ralph`, but do not publish a second
  # model-authored orchestration surface beside `run_code` in PTC mode.
  - id: tool-workflow
    name: '@deepseek-ai/dsh-tool-workflow'
    disabled: true

  # PTC mode for this agent alone. The row waits for the host's `codeRuntime`
  # rather than assuming it: a deployment that composes no TypeScript runtime
  # fails this preset at mount, naming this id, instead of at the first request.
  - insert:
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: ptc
