# The dsh-rxlab-app bundle patch: the rxlab workbench surface over the dsh-base
# layer. Unlike the web surface, rxlab serves a standalone SPA (apps/rxlab-web,
# built to @deepseek-ai/dsh-rxlab-web-frontend/dist) and does not load the
# Cordis browser client roster; the only browser-facing rows here are the
# transport and browser-authentication half. The agent plane keeps the base
# defaults until rxlab gains its own session UI, so sessions are not created
# from this surface in the current build.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The rxlab-startup plugin injects `cmdlineArgs` and provides `rxlabStartup` as
# an ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The rxlab runtime then
# provides bind-dependent `rxlabRuntime` values to the trust fence.
# `dsh --profile rxlab --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model, working inside rxlab,
      the DeepSeek Harness workbench for the glasses-packing domain
      (验光配镜工作台). Your working directory is {{cwd}}. The workbench is served
      as a standalone browser app by this profile; its business modules and agent
      session surface are not connected yet. If asked to operate them, say they
      are not available instead of inventing tools or steps.

# ── rxlab durable-data isolation ────────────────────────────────────────────
# rxlab keeps its settings and session-family storage under rxlab-specific home
# paths so it can run beside the web profile over the same $DSH_HOME without
# sharing or rewriting web's durable data. Credentials stay shared so models
# keep working; attachments stay on shared defaults until rxlab gains its own
# business-module data.

- id: settings
  config:
    path: !!js dshHomePath('settings-rxlab.yaml')

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions-rxlab')

- id: storage-json
  config:
    root: !!js dshHomePath('storages-rxlab')

# ── rxlab host rows and the transport half ──────────────────────────────────

- insert:
    # Ordinary provider for the parsed rxlab flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: rxlab-startup
      name: '@deepseek-ai/dsh-rxlab-app/startup'

    # Plain route-registration carrier; host and port come from the app's
    # rxlabStartup provider, with these deployment fallbacks. The dist is served
    # by the rxlab-runtime row below through the fallback seat. rxlab defaults to
    # 3081 so it can run beside the web profile's 3080.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [rxlabStartup]
      config:
        host: !!js ctx.rxlabStartup.host ?? '127.0.0.1'
        port: !!js ctx.rxlabStartup.port ?? 3081
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # rxlab glue owned by this bundle: resolves the built rxlab-web frontend
    # dist (an assembly fact of dsh-rxlab-app, never user config), mounts the
    # frontend-static fallback owner, registers the rxlab-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles. The rxlabStartup provider
    # supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `rxlabRuntime`.
    - id: rxlab-runtime
      name: '@deepseek-ai/dsh-rxlab-app'
      inject: [rxlabStartup]
      config:
        openBrowser: !!js ctx.rxlabStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.rxlabStartup.trustedHosts

    # Owns the browser-authentication half: mints the signed cookie from the
    # process token (frontend-static gates every index render through it) and
    # is the future /api RPC gateway. The rxlabRuntime provider supplies the
    # LAN literals for the /api trust fence.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [rxlabRuntime]
      config:
        trustedHosts: !!js ctx.rxlabRuntime.trustedHosts
