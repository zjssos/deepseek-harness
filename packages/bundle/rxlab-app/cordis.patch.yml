# The dsh-rxlab-app bundle patch: the rxlab workbench surface over the dsh-base
# layer. Unlike the web surface, rxlab serves a standalone SPA (apps/rxlab-web,
# built to @deepseek-ai/dsh-rxlab-web-frontend/dist) and does not load the
# Cordis browser client roster; the only browser-facing rows here are the
# transport and browser-authentication half. The agent plane moves behind agent
# presets: the SPA drives sessions through the Remote surface
# (session-controller + api-remotes below) and each session's tool set is what
# its mounted preset contributes (see the disable block below).
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# The rxlab-startup plugin injects `cmdlineArgs` and provides `rxlabStartup` as
# an ordinary Cordis service. Rows configured from flags inject that service, so
# Loader resolves their expressions only after it exists. The rxlab runtime then
# provides bind-dependent `rxlabRuntime` values to the trust fence.
# `dsh --profile rxlab --help` provides neither service, so no server binds.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model, working inside rxlab,
      the DeepSeek Harness workbench for the glasses-packing domain
      (验光配镜工作台). Your working directory is {{cwd}}. The workbench is served
      as a standalone browser app by this profile; its agent session surface,
      the 商品 Wiki module (rxlab catalog master data), and the 商品采集 module
      (rxlab collect: platform/shop/product-link assets with deterministic link
      captures into the rxlab_collect domain) are live, while rxlab's
      other business modules (验光配镜、推荐校验、效果图) are not
      connected yet. If asked to operate the unconnected modules, say they are
      not available instead of inventing tools or steps.

# ── rxlab durable-data isolation ────────────────────────────────────────────
# rxlab keeps its settings and session-family storage under rxlab-specific home
# paths so it can run beside the web profile over the same $DSH_HOME without
# sharing or rewriting web's durable data. Credentials stay shared so models
# keep working; attachments stay on shared defaults until rxlab gains its own
# business-module data.
#
# Business storage moves into the workbench workspace so module artifacts and
# storage units live in one exportable tree: the rxlab-workspace-paths row
# resolves the workspace root (settings namespace `rxlab-workspace`, restart
# semantics) and storage-json reads the resolved storage root from it. The
# settings document and session logs stay in $DSH_HOME: the settings document
# defines where the workspace is, so it cannot live inside it.

- id: settings
  config:
    path: !!js dshHomePath('settings-rxlab.yaml')

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions-rxlab')

- id: storage-json
  inject: [rxlabPaths]
  config:
    root: !!js ctx.rxlabPaths.storageRoot

# ── the agent plane moves behind agent presets ─────────────────────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for the TUI, which is single-session and composes its agent process-wide; the
# rxlab surface disables them here and lets each session mount a preset instead
# (default `standard`, which mounts the same rows), so a module preset such as
# `collect` contributes exactly its own curated tool set rather than seeing the
# base rows too.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone reorders
# the composition. Host-plane stays mirror the web surface's reasoning: the
# shell-env/jobs/skill/subagent/task/goal services and the token meter remain
# process-wide registries or host-facing remotes.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# ── rxlab host rows and the transport half ──────────────────────────────────

- insert:
    # Ordinary provider for the parsed rxlab flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: rxlab-startup
      name: '@deepseek-ai/dsh-rxlab-app/startup'

    # Workbench workspace owner: registers the `rxlab-workspace` settings
    # namespace, provides `rxlabPaths` (workspace root + storage root), and
    # bootstraps the workspace skeleton on first use. Gated on rxlabStartup so
    # `--help` never creates or registers anything. The storage-json override
    # above injects this row's service, so business storage resolves inside
    # the workspace.
    - id: rxlab-workspace-paths
      name: '@deepseek-ai/dsh-rxlab-app/workspace-paths'
      inject: [rxlabStartup]
      config:
        root: !!js dshHomePath('rxlab-workspace')

    # Plain route-registration carrier; host and port come from the app's
    # rxlabStartup provider, with these deployment fallbacks. The dist is served
    # by the rxlab-runtime row below through the fallback seat. rxlab defaults to
    # 3081 so it can run beside the web profile's 3080.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [rxlabStartup]
      config:
        host: !!js ctx.rxlabStartup.host ?? '127.0.0.1'
        port: !!js ctx.rxlabStartup.port ?? 3081
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # rxlab glue owned by this bundle: resolves the built rxlab-web frontend
    # dist (an assembly fact of dsh-rxlab-app, never user config), mounts the
    # frontend-static fallback owner, registers the rxlab-surface prompt
    # section and the bash runtime variable, prints the URL line, and opens the
    # canonical local URL after the full tree settles. The rxlabStartup provider
    # supplies invocation-only values; after the server binds, this row samples
    # LAN trust once and provides `rxlabRuntime`.
    - id: rxlab-runtime
      name: '@deepseek-ai/dsh-rxlab-app'
      inject: [rxlabStartup]
      config:
        openBrowser: !!js ctx.rxlabStartup.openBrowser
        printUrl: true
        surfaceContext: true
        trustedHosts: !!js ctx.rxlabStartup.trustedHosts

    # Owns the browser-authentication half: mints the signed cookie from the
    # process token (frontend-static gates every index render through it) and
    # is the /api RPC gateway carrier. The rxlabRuntime provider supplies the
    # LAN literals for the /api trust fence.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [rxlabRuntime]
      config:
        trustedHosts: !!js ctx.rxlabRuntime.trustedHosts

    # ── session Remote surface for the standalone SPA ──────────────────────────
    # The base tree already carries the typert gateway, session log, workspace
    # registry, and agent services; these rows expose sessions over the /api
    # Remote channel and forward the api-session/* host events to the browser
    # $events stream. The SPA embeds the Cordis client data layer (without the
    # browser UI roster) and consumes the generated typed Remote namespaces.
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    # Exposes the `settings`/`credentials` Remote namespaces (the SPA's model
    # settings dialog reads and writes `$DSH_HOME/.credentials.yaml` through
    # credentials/describe + credentials/set) and the `workspace` Remote
    # namespace (the SPA archives sessions through workspace.archiveSession —
    # archive hides the row and keeps the log, matching the web product).
    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    # ── rxlab business data: the product-Wiki catalog ──────────────────────────
    # Owns the `rxlabCatalog` Remote namespace over the `rxlab_catalog` storage
    # domain (records land under the storages-rxlab root above). The package is
    # also a dsh.client row, so the SPA's headless boot mounts the namespace
    # from the package's own /client bundle; the platform api-remotes assembly
    # stays clean of rxlab-product data.
    - id: rxlab-catalog
      name: '@deepseek-ai/dsh-rxlab-catalog'

    # Owns the `rxlabCollect` Remote namespace over the `rxlab_collect` storage
    # domain (link assets, capture history, run batches; records land under the
    # storages-rxlab root above). Link runs use deterministic headless chromium
    # collectors with a serial in-process queue, so the module captures without
    # a model key. The package is also a dsh.client row, so the SPA's headless
    # boot mounts the namespace from its own /client bundle.
    - id: rxlab-collect
      name: '@deepseek-ai/dsh-rxlab-collect'

    # Owns the `rxlabFitting` Remote namespace over the `rxlab_fitting` storage
    # domain (staged refraction exam records; records land under the
    # storages-rxlab root above) plus the deterministic prescription derivation
    # engine behind its `derive` RPC. The package is also a dsh.client row, so
    # the SPA's headless boot mounts the namespace from its own /client bundle.
    - id: rxlab-fitting
      name: '@deepseek-ai/dsh-rxlab-fitting'

    # Owns the `rxlabUsage` Remote namespace over the `rxlab_usage` storage
    # domain: it listens to the session-projection change feed for the
    # token-meter `tokenUsage` unit and durably records per-session totals plus
    # per-module aggregates (module from the session cwd under the workspace
    # root), the accounting foundation for later per-module billing. The
    # package is also a dsh.client row, so the SPA mounts the namespace from its
    # own /client bundle. Requires the projection and workspace services, so it
    # lists them as injection order dependencies.
    - id: rxlab-usage
      name: '@deepseek-ai/dsh-rxlab-usage'
      inject: [storageDomain, sessionProjections, rxlabPaths]

    # Host-plane login-capable chromium (`ctx.collectBrowser`) behind the
    # collect agent's browser-use tools: one instance and one login profile
    # per host, so concurrent collect sessions share the profile instead of
    # racing Playwright's per-directory process lock. `dsh rxlab --cdp` flips
    # it from the owned persistent profile to attaching to a real browser over
    # Chrome DevTools Protocol (endpoint defaults to http://127.0.0.1:9222 in
    # the session service). The tools row that consumes it is per-session (the
    # shipped `collect` preset).
    - id: rxlab-collect-browser
      name: '@deepseek-ai/dsh-rxlab-collect/browser'
      inject: [rxlabStartup]
      config:
        launchMode: !!js "(ctx.rxlabStartup.cdp ? 'cdp' : 'persistent')"

    # Spawns a CDP-mode chromium on demand (executable path/port/profile from
    # the collect module settings, handed over by the browserLaunch RPC), so
    # the SPA can open a real logged-in browser and run captures through it
    # without relaunching the profile with `--cdp`.
    - id: rxlab-collect-browser-launch
      name: '@deepseek-ai/dsh-rxlab-collect/browser-launch'

    # The per-session agent preset roster (shipped presets bundled inside the
    # package as a read-only system root, locally authored presets under
    # $DSH_HOME/.agent-presets). The rxlab SPA composes every session on a
    # preset through the session-create wire's agentPreset field; the workbench
    # default (`standard`) carries the full tool set that used to be
    # process-wide.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # ── headless client data-layer runtime for the standalone SPA ──────────────
    # The rxlab SPA embeds the Cordis client DATA layer without the browser UI
    # roster: this row makes the modules node half compose window.__DSH_BOOT__
    # and serve /plugins/<id>/client.js for every active dsh.client row above
    # (typert-registry, api-gateway, connection, file-upload, api-remotes,
    # session-controller, rxlab-catalog, rxlab-collect, rxlab-fitting,
    # rxlab-usage). The SPA
    # boots those
    # bundles on a bare Cordis root; no ui-* or cordis-client-runner row is
    # mounted.
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'
